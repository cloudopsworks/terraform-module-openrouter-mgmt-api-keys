description: |-
  Terraform module for managing OpenRouter workspace API keys through the
  [cloudopsworks/openrouter](https://registry.terraform.io/providers/cloudopsworks/openrouter/latest)
  provider. Each managed API key is persisted immediately to AWS Secrets Manager because
  the OpenRouter management API only returns the raw secret value when the key is created.

# Introduction to the project
introduction: |-
  ## Overview

  This module manages OpenRouter API keys for existing workspaces and stores the generated
  credentials in AWS Secrets Manager.

  ### What it does

  1. **Creates OpenRouter API keys** for one or more existing workspaces.
  2. **Resolves workspace selectors** from `workspace_id`, `workspace_name`, or `workspace_slug`
     using the provider workspace data source when needed.
  3. **Supports per-key controls** such as spend limits, reset windows, disabled state,
     BYOK accounting, expiration, and creator assignment.
  4. **Persists every secret in AWS Secrets Manager as JSON** containing the credential
     (`api_key`), OpenRouter key hash (`api_key_id`), API key `name`, and
     OpenRouter-reported workspace UUID (`workspace_id`), whether rotation is enabled or not.
  5. **Optionally schedules secret rotation** for every key when the module-wide
     `settings.rotation_lambda` is set to a Lambda name or ARN. Set the shared interval with
     `settings.rotation_period_days` (default: 30 days). Per-key opt-out is available but not recommended.

  When no workspace selector is set for an entry, the module passes `null` through for
  `workspace_id` exactly as configured. OpenRouter may assign the key to a default
  workspace; the JSON secret records the workspace UUID reported for the created key.

  ### Naming convention

  For both the OpenRouter API key name and the AWS Secrets Manager secret name, you can use:

  | Mode | Result |
  |------|--------|
  | `name_prefix` | `<name_prefix>-<system_name>` |
  | `name` | fixed value, used verbatim |

  Secret paths default to `/<org_unit>/<env_name>/<env_type>/<workspace_key>` and can be
  overridden per API key with `secret.path`.

  ### Secret structure

  Every Terraform-created secret version stores `{"api_key":"<value>","api_key_id":"<key hash>","name":"<API key name>","workspace_id":"<workspace UUID>"}`.
  `secret.plain = true` is rejected, including when rotation is disabled or a key opts out.
  The `plain` input remains temporarily recognized so existing configurations fail with
  a clear validation error rather than silently changing format; remove it or set it to `false`.

  The JSON `name` and `workspace_id` come from the created OpenRouter key resource.
  `workspace_id` is not necessarily the input selector; it is JSON `null` if the
  provider response omits it. Adding `name` to an existing JSON secret creates a new
  secret version when applied. JSON consumers upgrading from earlier schemas must
  accept the additional field. Existing plain-string deployments must remove
  `secret.plain = true` and update consumers to parse JSON before applying this version.

  **Migration warning:** For an already-rotated JSON secret, applying the changed
  `secret_string` writes a new version and moves `AWSCURRENT` to Terraform's original-key
  payload. Consumers can switch from the Lambda-rotated credential to a stale or
  disabled original key. Back up the current version, coordinate and reconcile key
  ownership with the rotation Lambda and consumers before upgrading, and test in a
  nonproduction environment first. Adding the tracking fields does not resolve
  drift between Terraform-managed and Lambda-managed keys.

  ### Rotation prerequisites

  This module configures the Secrets Manager rotation schedule only; it does not create a
  Lambda function, replace an OpenRouter API key, or implement rotation logic. Supply an
  existing rotation Lambda that can replace the OpenRouter key. It must write the new
  `api_key`, matching `api_key_id`, the new key's `name`, and its `workspace_id` into
  the same `AWSPENDING` JSON secret version. The Lambda must preserve `name` and
  `workspace_id` when they do not change, update them when the key changes, and use
  JSON `null` for `workspace_id` only if no workspace ID is available. Validate the
  payload, then promote it to `AWSCURRENT`. Grant Secrets Manager permission to invoke
  the Lambda, and give the Lambda execution role the required
  Secrets Manager, OpenRouter, and (if applicable) KMS access. Omitting the module-wide
  `settings.rotation_lambda` disables rotation for all keys. Supply an existing Lambda
  name or ARN to enable rotation for every key unless that key sets
  `secret.rotation_enabled = false`. A name is resolved through a Lambda data lookup,
  so the Terraform caller needs Lambda read permissions; an ARN bypasses that lookup.
  Bare names resolve in the configured AWS provider account and Region to an unqualified
  function ARN. Full ARNs pass through unchanged, including an alias or version qualifier.
  **Per-key opt-out is not recommended** because it leaves that credential unrotated.
  Every key uses the same four-field JSON secret schema, regardless of whether it has
  a rotation schedule. Raw-string storage is no longer supported.
  When rotation is configured, the AWS provider enables it immediately by default,
  so Secrets Manager may invoke the Lambda during the first apply; ensure the Lambda
  and permissions are ready for every participating key.

  Terraform still owns the original OpenRouter API key and initial secret version. If the
  rotation Lambda revokes or deletes that key, a later apply may recreate the key and its
  secret version. Replacement keys created by the Lambda are not automatically adopted
  into Terraform state, and module outputs continue to describe the Terraform-managed
  key. Coordinate key ownership and drift handling before enabling external rotation.

# How to use this project
usage: |-
  ## Terragrunt scaffolding workflow

  ```sh
  # 1. Create and enter the target deployment directory
  mkdir -p production/us-east-1/spoke-001/openrouter-mgmt-api-keys
  cd production/us-east-1/spoke-001/openrouter-mgmt-api-keys

  # 2. Scaffold the module (do NOT use --working-dir)
  terragrunt scaffold github.com/cloudopsworks/terraform-module-openrouter-mgmt-api-keys

  # 3. Edit inputs.yaml with deployment-specific values
  vi inputs.yaml

  # 4. Apply
  terragrunt apply
  ```

  ## Example generated `inputs.yaml`

  ```yaml
  # Module configuration
  # settings:                               # (Optional) Settings for OpenRouter workspace API key management
  #   rotation_lambda: "rotate-openrouter-key" # (Optional) Existing module-wide Lambda name or ARN; omit to disable rotation for all keys. ARN example: arn:aws:lambda:us-east-1:123456789012:function:rotate-openrouter-key
  #   # Bare names use the configured AWS provider account/Region; full ARNs pass through, including any qualifier.
  #   rotation_period_days: 30            # (Optional) Module-wide rotation interval in whole days, 1-1000. Default: 30; used when rotation is enabled
  #   workspaces:                           # (Optional) Map of OpenRouter workspaces keyed by a logical name
  #     engineering:                        # Logical key used to identify the workspace in this module
  #       workspace_id: "ws_1234567890"    # (Optional) OpenRouter workspace UUID. Mutually exclusive with workspace_name and workspace_slug
  #       workspace_name: "Engineering"    # (Optional) OpenRouter workspace name resolved via the provider workspace data source. Mutually exclusive with workspace_id and workspace_slug
  #       workspace_slug: "engineering"    # (Optional) OpenRouter workspace slug resolved via the provider workspace data source. Mutually exclusive with workspace_id and workspace_name
  #       api_keys:                         # (Optional) Map of API key configurations keyed by logical name
  #         backend-service:
  #           name_prefix: "backend"       # (Optional) Name prefix; final name = name_prefix + "-" + system_name
  #           name: "fixed-name"           # (Optional) Fixed name for the API key (mutually exclusive with name_prefix)
  #           limit: 250                    # (Optional) Spending limit in USD
  #           limit_reset: "monthly"       # (Optional) Reset interval. Valid values: daily, weekly, monthly
  #           include_byok_in_limit: true   # (Optional) Whether BYOK usage counts toward the limit
  #           disabled: false               # (Optional) Whether the key is disabled. Default: provider default
  #           expires_at: "2026-12-31T23:59:59Z" # (Optional) UTC ISO-8601 expiration timestamp
  #           creator_user_id: "user_123"  # (Optional) OpenRouter organization member ID to set as creator
  #           secret:                       # (Optional) AWS Secrets Manager configuration for storing the API key
  #             name_prefix: "backend"     # (Optional) Secret name prefix; final name = name_prefix + "-" + system_name
  #             name: "fixed-secret"       # (Optional) Fixed secret name (mutually exclusive with secret.name_prefix)
  #             path: "/custom/path"       # (Optional) Secret path prefix. Default: /<org_unit>/<env_name>/<env_type>/<workspace_key>
  #             plain: false                # (Optional, deprecated) Must be false; all secrets store JSON with api_key, api_key_id, name, and workspace_id, with or without rotation.
  #             description: "..."         # (Optional) Human-readable description for the Secrets Manager secret
  #             rotation_enabled: false     # (Optional) Opt out of module-wide rotation; default true. NOT RECOMMENDED
  settings:
    workspaces:
      engineering:
        workspace_slug: "engineering"
        api_keys:
          backend-service:
            name_prefix: "backend"
            limit: 250
            limit_reset: "monthly"
            include_byok_in_limit: true
            secret:
              name_prefix: "backend-openrouter"
              description: "Backend service OpenRouter key"
          break-glass:
            name: "openrouter-break-glass"
            disabled: false
            expires_at: "2026-12-31T23:59:59Z"
            secret:
              name: "openrouter-break-glass"
      shared-services:
        workspace_name: "Shared Services"
        api_keys:
          reporting:
            name_prefix: "reporting"
  ```

  ## Generated `terragrunt.hcl`

  ```hcl
  locals {
    local_vars  = yamldecode(file("./inputs.yaml"))
    spoke_vars  = yamldecode(file(find_in_parent_folders("spoke-inputs.yaml")))
    region_vars = yamldecode(file(find_in_parent_folders("region-inputs.yaml")))
    env_vars    = yamldecode(file(find_in_parent_folders("env-inputs.yaml")))
    global_vars = yamldecode(file(find_in_parent_folders("global-inputs.yaml")))

    local_tags  = jsondecode(file("./local-tags.json"))
    spoke_tags  = jsondecode(file(find_in_parent_folders("spoke-tags.json")))
    region_tags = jsondecode(file(find_in_parent_folders("region-tags.json")))
    env_tags    = jsondecode(file(find_in_parent_folders("env-tags.json")))
    global_tags = jsondecode(file(find_in_parent_folders("global-tags.json")))

    tags = merge(
      local.global_tags,
      local.env_tags,
      local.region_tags,
      local.spoke_tags,
      local.local_tags
    )
  }

  include "root" {
    path = find_in_parent_folders("root.hcl")
  }

  terraform {
    source = "git::https://github.com/cloudopsworks/terraform-module-openrouter-mgmt-api-keys.git"
  }

  inputs = {
    is_hub     = false
    org        = local.env_vars.org
    spoke_def  = local.spoke_vars.spoke
    settings   = try(local.local_vars.settings, {})
    extra_tags = local.tags
  }
  ```

  ## Input model

  ### Top-level variables

  | Variable | Type | Required | Description |
  |----------|------|----------|-------------|
  | `org.organization_name` | `string` | yes | Organisation name used in tags |
  | `org.organization_unit` | `string` | yes | Org unit; becomes the first segment of the default secret path |
  | `org.environment_type` | `string` | yes | Environment type such as `production` or `staging` |
  | `org.environment_name` | `string` | yes | Environment name such as `prod` or `stg` |
  | `spoke_def` | `string` | no | Three-digit spoke identifier. Default: `"001"` |
  | `extra_tags` | `map(string)` | no | Additional tags merged onto all AWS secrets |
  | `settings.rotation_lambda` | `string` | no | Existing module-wide rotation Lambda name or ARN; omit to disable rotation for all keys |
  | `settings.rotation_period_days` | `number` | no | Shared rotation interval in whole days, 1–1000; default `30`. Used when rotation is enabled |
  | `settings.workspaces` | `map(object)` | no | Map of OpenRouter workspaces keyed by logical name |

  ### `settings.workspaces.<key>`

  | Attribute | Type | Required | Description |
  |-----------|------|----------|-------------|
  | `workspace_id` | `string` | no* | Existing OpenRouter workspace UUID |
  | `workspace_name` | `string` | no* | Existing OpenRouter workspace name, resolved to an ID via `data.openrouter_workspaces` |
  | `workspace_slug` | `string` | no* | Existing OpenRouter workspace slug, resolved to an ID via `data.openrouter_workspaces` |
  | `api_keys` | `map(object)` | no | API keys to manage inside the workspace |

  \* Set at most one of `workspace_id`, `workspace_name`, or `workspace_slug`. If none are set, `null` is passed through for `workspace_id`.

  ### `settings.workspaces.<key>.api_keys.<key>`

  | Attribute | Type | Required | Description |
  |-----------|------|----------|-------------|
  | `name_prefix` | `string` | no* | Name prefix composed as `name_prefix-<system_name>` |
  | `name` | `string` | no* | Fixed API key name |
  | `limit` | `number` | no | Spending limit in USD |
  | `limit_reset` | `string` | no | One of `daily`, `weekly`, `monthly` |
  | `include_byok_in_limit` | `bool` | no | Whether BYOK usage counts toward the limit |
  | `disabled` | `bool` | no | Whether the API key is disabled |
  | `expires_at` | `string` | no | UTC ISO-8601 expiration timestamp |
  | `creator_user_id` | `string` | no | Creator member identifier in OpenRouter |
  | `secret.name_prefix` | `string` | no | Secret name prefix composed as `name_prefix-<system_name>` |
  | `secret.name` | `string` | no | Fixed secret name |
  | `secret.path` | `string` | no | Secret path prefix. Default: `/<org_unit>/<env_name>/<env_type>/<workspace_key>` |
  | `secret.plain` | `bool` | no | Deprecated compatibility input; default `false`, and `true` is always rejected. Every secret stores JSON with `api_key`, `api_key_id`, `name`, and `workspace_id` |
  | `secret.description` | `string` | no | Human-readable description for the AWS secret |
  | `secret.rotation_enabled` | `bool` | no | Default `true`. Set `false` to opt out of module-wide rotation; **not recommended** |

  \* Exactly one of `name_prefix` or `name` must be provided.

# Example usage
examples: |-
  ## Minimal example

  ```hcl
  inputs = {
    org = {
      organization_name = "acme"
      organization_unit = "platform"
      environment_type  = "production"
      environment_name  = "prod"
    }

    settings = {
      workspaces = {
        engineering = {
          workspace_slug = "engineering"
          api_keys = {
            backend = {
              name_prefix = "backend"
            }
          }
        }
      }
    }
  }
  ```

  ## Workspace with budgeted and expiring keys

  ```hcl
  inputs = {
    org = {
      organization_name = "acme"
      organization_unit = "platform"
      environment_type  = "production"
      environment_name  = "prod"
    }

    settings = {
      workspaces = {
        shared-services = {
          workspace_name = "Shared Services"
          api_keys = {
            ci = {
              name_prefix           = "ci"
              limit                 = 100
              limit_reset           = "monthly"
              include_byok_in_limit = true
              secret = {
                name_prefix = "ci-openrouter"
              }
            }

            temporary = {
              name       = "temporary-openrouter-key"
              expires_at = "2026-12-31T23:59:59Z"
              secret = {
                name = "temporary-openrouter-key"
              }
            }
          }
        }
      }
    }
  }
  ```

  ## Module-wide Secrets Manager rotation

  The Lambda must already exist and have the permissions described under **Rotation prerequisites**.
  Supplying one `settings.rotation_lambda` name or ARN enables rotation for every key at
  the shared `settings.rotation_period_days` interval. Set `secret.rotation_enabled = false`
  only for an exceptional opt-out; this is **not recommended**.
  Setting a period alone does not enable rotation.

  ```hcl
  inputs = {
    org = {
      organization_name = "acme"
      organization_unit = "platform"
      environment_type  = "production"
      environment_name  = "prod"
    }

    settings = {
      # Alternatively use the function name "rotate-openrouter-key" for an AWS Lambda lookup.
      rotation_lambda = "arn:aws:lambda:us-east-1:123456789012:function:rotate-openrouter-key"
      rotation_period_days = 45
      workspaces = {
        engineering = {
          workspace_id = "ws_1234567890"
          api_keys = {
            backend = {
              name = "backend-openrouter"
            }
            exceptional_key = {
              name = "exceptional-openrouter-key"
              secret = {
                rotation_enabled = false # Opt out only when strictly necessary; not recommended.
              }
            }
          }
        }
      }
    }
  }
  ```

# How to get started quickly
quickstart: |-
  1. Ensure the runtime has:
     - **AWS credentials** for Secrets Manager access.
     - **OpenRouter management API credentials** through the provider configuration or the
       `OPENROUTER_API_KEY` environment variable.

  2. Scaffold a new Terragrunt deployment directory and populate `inputs.yaml`.

  3. Run:

     ```sh
     terragrunt init
     terragrunt plan
     terragrunt apply
     ```

  4. Retrieve a stored key from AWS Secrets Manager:

     ```sh
     aws secretsmanager get-secret-value \
       --secret-id "$(terragrunt output -json secret_names | jq -r 'to_entries[0].value')"
     ```

